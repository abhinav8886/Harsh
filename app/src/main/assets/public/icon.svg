<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe-zone margin -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="14" />
  <circle cx="256" cy="240" r="142" fill="#0B132B" stroke="#334155" stroke-width="3" />

  <!-- Geometry Triangle -->
  <polygon points="256,120 160,280 352,280" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linejoin="round" />

  <!-- Compass / Protractor Arc -->
  <path d="M 196,280 A 60,60 0 0,1 316,280" fill="none" stroke="#38BDF8" stroke-width="8" stroke-dasharray="6,4" />

  <!-- Math Symbol Pi (π) in the Center -->
  <text x="256" y="246" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="bold" font-size="64" fill="#FFFFFF">
    π
  </text>

  <!-- Gold Star Medal Badge at bottom -->
  <circle cx="256" cy="370" r="38" fill="url(#goldGrad)" stroke="#B45309" stroke-width="4" />
  <polygon points="256,346 265,364 285,365 269,378 274,397 256,386 238,397 243,378 227,365 247,364" fill="#FFFFFF" />

  <!-- Laurel Leaf Ribbons -->
  <path d="M 218,370 L 190,410 L 210,414 Z" fill="#D97706" />
  <path d="M 294,370 L 322,410 L 302,414 Z" fill="#D97706" />
</svg>
