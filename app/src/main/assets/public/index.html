    <script>
      // AI Studio preview environment: HMR is disabled in cloud containers.
      // Mock vite-hmr WebSocket cleanly to prevent "WebSocket closed without opened" errors.
      (function() {
        if (typeof window === 'undefined') return;
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('@vite') || url.includes('token=')));
            if (isViteHmr) {
              var target = new EventTarget();
              target.binaryType = 'blob';
              target.readyState = 1; // WebSocket.OPEN
              target.bufferedAmount = 0;
              target.extensions = '';
              target.protocol = 'vite-hmr';
              target.url = String(url);
              target.onopen = null;
              target.onclose = null;
              target.onerror = null;
              target.onmessage = null;
              target.send = function() {};
              target.close = function() {
                target.readyState = 3;
                if (typeof target.onclose === 'function') target.onclose(new Event('close'));
              };
              setTimeout(function() {
                var openEvt = new Event('open');
                if (typeof target.onopen === 'function') target.onopen(openEvt);
                target.dispatchEvent(openEvt);
              }, 0);
              return target;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Global safety net for unhandled Vite WebSocket errors
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var errStr = String(event.reason.message || event.reason || '');
            var stackStr = String(event.reason.stack || '');
            if (errStr.includes('WebSocket') || stackStr.includes('@vite/client')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (event) {
            var msg = String(event.message || '');
            var filename = String(event.filename || '');
            if (msg.includes('WebSocket') || filename.includes('@vite/client')) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }
        }, true);
      })();
    </script>
