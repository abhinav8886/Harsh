// Top-level build file for Harsh's Olympiad Lab Android Project.
// Repositories are configured centrally in settings.gradle.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
